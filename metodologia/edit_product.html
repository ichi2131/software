<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Editar Producto</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .user-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: var(--border-radius);
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }

        .user-badge {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8em;
        }

        .logout-btn {
            background: var(--delete-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: var(--delete-hover);
        }

        body {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="user-info">
        <span id="userName">Usuario</span>
        <span id="userRole" class="user-badge">Rol</span>
        <a href="index.html" class="home-btn" style="background: linear-gradient(135deg, #2196F3 0%, #21CBDB 100%); color: white; border: none; padding: 8px 12px; border-radius: var(--border-radius); cursor: pointer; font-size: 0.9em; text-decoration: none; display: inline-block; font-weight: 600;">🏠 Inicio</a>
        <button class="logout-btn" onclick="handleLogout()" style="background: linear-gradient(135deg, #DC3545 0%, #E74C3C 100%);">Salir</button>
    </div>

    <!-- Header será renderizado por JavaScript -->

    <nav class="nav-links">
        <a href="index.html" class="nav-link">🏠 Inicio</a>
        <a href="view_inventory.html" class="nav-link">📦 Ver Inventario</a>
    </nav>
    
    <div class="container" style="max-width: 90%; width: 100%; margin: 20px auto; box-sizing: border-box;">
        <h1 style="text-align: center; color: var(--primary-color); margin-bottom: 20px;">✏️ Editar Producto</h1>
        <form id="editForm" style="background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); box-sizing: border-box;">
            <div class="form-group">
                <label for="name">Nombre del Producto:</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label for="description">Descripción:</label>
                <textarea id="description" rows="3" style="resize: vertical;"></textarea>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 15px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="quantity">Cantidad:</label>
                    <input type="number" id="quantity" min="0" required>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label for="price">Precio:</label>
                    <input type="number" id="price" step="0.01" min="0" required>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label for="category">Categoría:</label>
                    <select id="category" required>
                        <option value="Electrónicos">Electrónicos</option>
                        <option value="Ropa">Ropa</option>
                        <option value="Alimentos">Alimentos</option>
                        <option value="Hogar">Hogar</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="supplier">Proveedor:</label>
                <input type="text" id="supplier">
            </div>

            <div class="action-buttons" style="margin-top: 25px;">
                <button type="submit" class="btn btn-blue btn-large">✅ Actualizar Producto</button>
            </div>
        </form>
    </div>

    <script src="app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id'));

        window.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            const user = getCurrentUser();
            document.getElementById('userName').textContent = user.fullName || user.username;
            document.getElementById('userRole').textContent = user.role.toUpperCase();

            // Renderizar header y footer
            renderHeader();
            renderFooter();

            if (!hasPermission('edit_product')) {
                document.body.innerHTML = '<div class="container"><h2>❌ Acceso Denegado</h2><p>No tienes permiso para editar productos. Solo el administrador puede realizar esta acción.</p></div>';
                return;
            }

            loadProduct();
        });

        function loadProduct() {
            const inventory = getInventory();
            const product = inventory.find(p => p.id === productId);
            if (product) {
                document.getElementById('name').value = product.name;
                document.getElementById('description').value = product.description;
                document.getElementById('quantity').value = product.quantity;
                document.getElementById('price').value = product.price;
                document.getElementById('category').value = product.category;
                document.getElementById('supplier').value = product.supplier;
            }
        }

        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let inventory = getInventory();
            const index = inventory.findIndex(p => p.id === productId);
            if (index !== -1) {
                inventory[index] = {
                    ...inventory[index],
                    name: document.getElementById('name').value,
                    description: document.getElementById('description').value,
                    quantity: parseInt(document.getElementById('quantity').value),
                    price: parseFloat(document.getElementById('price').value),
                    category: document.getElementById('category').value,
                    supplier: document.getElementById('supplier').value
                };
                localStorage.setItem('inventory', JSON.stringify(inventory));
                alert('Producto actualizado exitosamente!');
                window.location.href = 'view_inventory.html';
            }
        });

        function handleLogout() {
            if (confirm('¿Deseas cerrar sesión?')) {
                logout();
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
