<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%) !important;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
            animation: slideIn 0.5s ease-out;
            border: 1px solid rgba(33, 150, 243, 0.1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 2.2em;
            font-weight: 700;
        }

        .login-subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1em;
            font-family: var(--font-family);
            box-sizing: border-box;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(33, 150, 243, 0.3);
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.02), rgba(33, 203, 243, 0.02));
        }

        .login-btn {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(33, 150, 243, 0.4);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        .error-message {
            color: var(--error-text);
            background-color: var(--error-bg);
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid var(--error-text);
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .info-box {
            background: linear-gradient(135deg, var(--success-bg) 0%, rgba(212, 237, 218, 0.5) 100%);
            color: var(--success-text);
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 0.9em;
            border-left: 4px solid var(--success-text);
            box-shadow: 0 2px 8px rgba(40, 167, 69, 0.1);
        }

        .info-box h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .user-item {
            margin: 10px 0;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 6px;
        }

        .user-item strong {
            color: var(--primary-color);
        }

        header,
        nav {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 Acceso al Sistema</h1>
        
        <div class="info-box">
            <h3>Usuarios de Prueba:</h3>
            <div class="user-item">
                <strong>Owner:</strong> owner / owner123
            </div>
            <div class="user-item">
                <strong>Admin:</strong> admin / admin123
            </div>
            <div class="user-item">
                <strong>Inspector:</strong> tester / tester123
            </div>
            <div class="user-item">
                <strong>Tesorera:</strong> tesorera / tesorera123
            </div>
            <div class="user-item">
                <strong>Comprador:</strong> buyer / buyer123
            </div>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" required placeholder="Ingrese su usuario">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="Ingrese su contraseña">
            </div>

            <button type="submit" class="login-btn">Iniciar Sesión</button>
        </form>

        <div style="margin-top: 20px; text-align: center; border-top: 1px solid var(--border-color); padding-top: 20px;">
            <p style="margin: 0 0 15px 0; color: var(--text-color);">¿No tienes cuenta?</p>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; width: 100%; box-sizing: border-box; align-items: center; max-width: 350px; margin-left: auto; margin-right: auto;">
                <a href="signup.html" class="login-btn" style="display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #28a745 0%, #20c997 100%); text-decoration: none; color: white; padding: 14px 16px; font-size: 0.95em; font-weight: 700; width: 90%; max-width: 300px; box-sizing: border-box; border-radius: 8px; min-height: 44px; margin: 0 auto;">📝 Crear Cuenta</a>
                <button class="login-btn" onclick="loginAsGuest()" style="background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%); padding: 14px 16px; font-size: 0.95em; font-weight: 700; width: 90%; max-width: 300px; box-sizing: border-box; min-height: 44px; border-radius: 8px; border: none; cursor: pointer; margin: 0 auto;">👤 Invitado</button>
            </div>
            <button class="login-btn" onclick="handleResetUsers()" style="background: linear-gradient(135deg, #dc3545 0%, #c82333 100%); padding: 12px 16px; font-size: 0.9em; width: 90%; max-width: 300px; font-weight: 700; box-sizing: border-box; min-height: 44px; border-radius: 8px; border: none; cursor: pointer; margin: 0 auto; display: flex; align-items: center; justify-content: center;">🔄 Resetear Usuarios</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Inicializar base de datos al cargar
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await initDatabase();
                
                const user = getCurrentUser();
                if (user) {
                    if (user.role === 'guest') {
                        window.location.href = 'browse.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                }
            } catch (error) {
                console.error('Error inicializando BD:', error);
            }
        });

        function loginAsGuest() {
            loginGuest();
            window.location.href = 'browse.html';
        }

        async function handleResetUsers() {
            if (confirm('⚠️ Esto va a resetear todos los usuarios a los valores por defecto. ¿Está seguro?')) {
                resetUsers();
                alert('✅ Usuarios reseteados correctamente:\n\n👤 Owner: owner / owner123\n👨‍💼 Admin: admin / admin123\n🔍 Inspector: tester / tester123\n💰 Tesorera: tesorera / tesorera123\n🛍️ Comprador: buyer / buyer123');
                location.reload();
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const success = await login(username, password);
            if (success) {
                window.location.href = 'index.html';
            } else {
                const errorDiv = document.getElementById('errorMessage');
                errorDiv.textContent = '❌ Usuario o contraseña incorrectos';
                errorDiv.style.display = 'block';
                document.getElementById('password').value = '';
            }
        }
    </script>
</body>
</html>
