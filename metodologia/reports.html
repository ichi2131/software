<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Reportes</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .user-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: var(--border-radius);
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }
        .user-badge {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8em;
        }
        .logout-btn {
            background: var(--delete-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 0.9em;
        }
        body { position: relative; }
    </style>
</head>
<body>
    <div class="user-info">
        <span id="userName">Usuario</span>
        <span id="userRole" class="user-badge">Rol</span>
        <a href="index.html" class="home-btn" style="background: linear-gradient(135deg, #2196F3 0%, #21CBDB 100%); color: white; border: none; padding: 8px 12px; border-radius: var(--border-radius); cursor: pointer; font-size: 0.9em; text-decoration: none; display: inline-block; font-weight: 600;">🏠 Inicio</a>
        <button class="logout-btn" onclick="handleLogout()" style="background: linear-gradient(135deg, #DC3545 0%, #E74C3C 100%);">Salir</button>
    </div>

    <!-- Header será renderizado por JavaScript -->

    <nav class="nav-links">
        <a href="index.html" class="nav-link">🏠 Inicio</a>
        <a href="view_inventory.html" class="nav-link">📦 Ver Inventario</a>
    </nav>
    
    <div class="container">
        <h1 style="text-align: center; color: var(--primary-color); margin-bottom: 35px;">📊 Reportes de Inventario</h1>

        <div class="card-grid">
            <div class="card-item">
                <h3>⚠️ Stock Bajo</h3>
                <p style="font-size: 0.9em; color: #666;">Productos con menos de 10 unidades</p>
                <div style="overflow-x: auto;">
                    <table id="lowStockTable" style="width: 100%; margin-top: 15px;">
                        <thead>
                            <tr>
                                <th style="text-align: left;">Nombre</th>
                                <th style="text-align: left;">Cantidad</th>
                                <th style="text-align: left;">Categoría</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="card-item">
                <h3>💰 Valor Total</h3>
                <p style="font-size: 0.9em; color: #666;">Valor total del inventario</p>
                <div id="totalValue" style="font-size: 2em; color: var(--primary-color); font-weight: 700; margin-top: 25px;">Calculando...</div>
            </div>
        </div>

        <div style="background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 25px;">
            <h3 style="color: var(--primary-color); margin-top: 0;">📂 Productos por Categoría</h3>
            <div style="overflow-x: auto;">
                <table id="categoryTable" style="width: 100%;">
                    <thead>
                        <tr>
                            <th style="text-align: left;">Categoría</th>
                            <th style="text-align: left;">Cantidad</th>
                            <th style="text-align: left;">Valor Total</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            const user = getCurrentUser();
            document.getElementById('userName').textContent = user.fullName || user.username;
            document.getElementById('userRole').textContent = user.role.toUpperCase();

            // Renderizar header y footer
            renderHeader();
            renderFooter();

            if (!hasPermission('view_reports')) {
                document.body.innerHTML = '<div class="container"><h2>❌ Acceso Denegado</h2><p>No tienes permiso para ver reportes.</p></div>';
                return;
            }

            generateReports();
        });

        function generateReports() {
            const inventory = getInventory();

            // Stock bajo
            const lowStock = inventory.filter(p => p.quantity < 10);
            const lowStockTbody = document.querySelector('#lowStockTable tbody');
            lowStockTbody.innerHTML = '';
            lowStock.forEach(product => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${product.name}</td>
                    <td>${product.quantity}</td>
                    <td>${product.category}</td>
                `;
                lowStockTbody.appendChild(row);
            });

            // Valor total
            if (hasPermission('view_prices')) {
                const totalValue = inventory.reduce((sum, p) => sum + (p.price * p.quantity), 0);
                document.getElementById('totalValue').textContent = `$${totalValue.toFixed(2)}`;

                // Por categoría
                const categories = {};
                inventory.forEach(product => {
                    if (!categories[product.category]) {
                        categories[product.category] = { count: 0, value: 0 };
                    }
                    categories[product.category].count++;
                    categories[product.category].value += product.price * product.quantity;
                });
                const categoryTbody = document.querySelector('#categoryTable tbody');
                categoryTbody.innerHTML = '';
                for (const [cat, data] of Object.entries(categories)) {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${cat}</td>
                        <td>${data.count}</td>
                        <td>$${data.value.toFixed(2)}</td>
                    `;
                    categoryTbody.appendChild(row);
                }
            } else {
                document.getElementById('totalValue').textContent = '-- (Acceso restringido)';
                document.querySelector('#categoryTable tbody').innerHTML = '<tr><td colspan="3">Acceso restringido</td></tr>';
            }
        }

        function handleLogout() {
            if (confirm('¿Deseas cerrar sesión?')) {
                logout();
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
