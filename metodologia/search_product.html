<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Buscar Producto</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .user-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: var(--border-radius);
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }
        .user-badge {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8em;
        }
        .logout-btn {
            background: var(--delete-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 0.9em;
        }
        body { position: relative; }
    </style>
</head>
<body>
    <div class="user-info">
        <span id="userName">Usuario</span>
        <span id="userRole" class="user-badge">Rol</span>
        <a href="index.html" class="home-btn" style="background: linear-gradient(135deg, #2196F3 0%, #21CBDB 100%); color: white; border: none; padding: 8px 12px; border-radius: var(--border-radius); cursor: pointer; font-size: 0.9em; text-decoration: none; display: inline-block; font-weight: 600;">🏠 Inicio</a>
        <button class="logout-btn" onclick="handleLogout()" style="background: linear-gradient(135deg, #DC3545 0%, #E74C3C 100%);">Salir</button>
    </div>

    <!-- Header será renderizado por JavaScript -->

    <nav class="nav-links">
        <a href="index.html" class="nav-link">🏠 Inicio</a>
        <a href="view_inventory.html" class="nav-link">📦 Ver Inventario</a>
    </nav>
    
    <div class="container">
        <h1 style="text-align: center; color: var(--primary-color); margin-bottom: 30px;">🔍 Buscar Productos</h1>
        
        <div class="search-box" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 30px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 15px; align-items: end;">
                <div class="form-group">
                    <label>Buscar por nombre:</label>
                    <input type="text" id="searchName" placeholder="Ingrese nombre del producto">
                </div>
                <div class="form-group">
                    <label>Categoría:</label>
                    <select id="searchCategory">
                        <option value="">Todas las categorías</option>
                        <option value="Electrónicos">Electrónicos</option>
                        <option value="Ropa">Ropa</option>
                        <option value="Alimentos">Alimentos</option>
                        <option value="Hogar">Hogar</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>
                <button class="btn btn-blue" onclick="searchProducts()" style="width: auto;">🔍 Buscar</button>
            </div>
        </div>
        
        <div style="overflow-x: auto;">
            <table id="searchResults" style="background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Cantidad</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Proveedor</th>
                    </tr>
                </thead>
                <tbody></tbody>
    </table>

    <script src="app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            const user = getCurrentUser();
            document.getElementById('userName').textContent = user.fullName || user.username;
            document.getElementById('userRole').textContent = user.role.toUpperCase();

            // Renderizar header y footer
            renderHeader();
            renderFooter();

            searchProducts();
        });

        function searchProducts() {
            const nameQuery = document.getElementById('searchName').value.toLowerCase();
            const categoryQuery = document.getElementById('searchCategory').value;
            const inventory = getInventory();
            const results = inventory.filter(product => {
                const matchesName = product.name.toLowerCase().includes(nameQuery);
                const matchesCategory = !categoryQuery || product.category === categoryQuery;
                return matchesName && matchesCategory;
            });
            displayResults(results);
        }

        function displayResults(results) {
            const tbody = document.querySelector('#searchResults tbody');
            tbody.innerHTML = '';
            results.forEach(product => {
                let priceCell = hasPermission('view_prices') 
                    ? `<td>$${product.price.toFixed(2)}</td>` 
                    : '<td>--</td>';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${product.name}</td>
                    <td>${product.description}</td>
                    <td>${product.quantity}</td>
                    ${priceCell}
                    <td>${product.category}</td>
                    <td>${product.supplier}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function handleLogout() {
            if (confirm('¿Deseas cerrar sesión?')) {
                logout();
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
